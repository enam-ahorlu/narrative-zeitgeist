# Copy this file to .github/workflows/ci.yml. It lives here because Claude's file
# access cannot write inside .github. Runs lint, unit tests and the browser suite.
name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:browser
      - run: git diff --check
